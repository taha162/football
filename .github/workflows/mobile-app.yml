# Builds the Android app (mobile/, Capacitor) on GitHub's Linux runners, which
# come with the Android SDK:
# - Every pull request touching mobile/ (and on demand): a debug APK, attached
#   to the run as «al-malab-debug-apk», to install on a phone for testing.
# - On demand with «release» ticked: the signed bundle (.aab) for Google Play,
#   once the upload key is saved as repository secrets (mobile/README.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD.
# - GOOGLE_SERVICES_JSON (optional, the Firebase file for push notifications):
#   without it the app builds and works, without notifications on Android.
#
# The iPhone app is built in Xcode on a Mac (mobile/README.md): macOS runners
# cost ten times the free minutes of private repositories, so none runs here.
name: Mobile app

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-app.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also build the signed bundle (.aab) for Google Play"
        type: boolean
        default: false
      site_url:
        description: "The site the app opens (empty: production)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      APP_SITE_URL: ${{ inputs.site_url }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Firebase file for notifications (when saved)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json: added"
          else
            echo "google-services.json: not saved; the app builds without Android notifications"
          fi
      - name: Copy the app's pages and settings into the Android project
        run: |
          # An empty site_url means production (capacitor.config.ts).
          [ -n "$APP_SITE_URL" ] || unset APP_SITE_URL
          node scripts/prepare-www.mjs
          npx cap sync android
      - name: Debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: al-malab-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Signed bundle for Google Play
        if: ${{ inputs.release }}
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Save the upload key as repository secrets first (mobile/README.md, «مفتاح التوقيع»)."
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon bundleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.release }}
        with:
          name: al-malab-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
